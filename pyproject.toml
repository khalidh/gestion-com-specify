[project]
name = "enterprise-modernization-agent-factory"
version = "0.1.0"
description = "Read-only modernization analysis workflows for enterprise applications"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests/factory"]
addopts = "-ra"